<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Game Pikachu</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body{
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-image: url("./image/pikachu.jpg");
            background-size: cover;
            background-repeat: no-repeat;
            text-align: center;
        }

        #main-game{
            margin-top: 150px;
        }

        .game-name{
            font-size: 80px;
            color: yellow;
            margin-bottom: 50px;
        }

        .menu-btn{
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .btn-menu{
            width: 220px;
            height: 50px;
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
            border: 3px solid #000000;
            border-radius: 10px;
            cursor: pointer;
        }

        .btn-menu:hover{
            background-color: darkkhaki;
        }

        #table-level{
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .bg-black{
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 9998;
        }

        .table-popup{
            position: relative;
            background-color: cornflowerblue;
            width: 350px;
            padding: 30px;
            border: 3px solid #000000;
            border-radius: 10px;
            z-index: 9999;
        }

        .table-popup h2{
            margin-top: 0;
            color: white;
        }

        .btn-level{
            display: block;
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            font-size: 20px;
            font-weight: bold;
            border: 3px solid #000000;
            border-radius: 10px;
            cursor: pointer;
        }

        .btn-level:hover{
            background-color: darkkhaki;
        }

        .btn-close{
            display: block;
            width: 100%;
            padding: 10px;
            margin-top: 25px;
            font-size: 20px;
            background-color: darkgray;
            color: white;
            border: 3px solid #000000;
            border-radius: 10px;
            cursor: pointer;
        }

        .btn-close:hover{
            background-color: dimgray;
        }

        #game-screen{
            display: none;
        }

        #level-title{
            color: gold;
        }

        #board{
            display: grid;
            grid-template-columns: repeat(16, 50px);
            gap: 2px;
            margin: 20px auto;
            width: max-content;
            background-color: transparent;
            padding: 5px;
        }

        /*Tao o vuong cho bang game (tile)*/
        .tile{
            width: 50px;
            height: 50px;
            background-color: white;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-sizing: border-box;
        }

        .tile:hover{
            background-color: darkkhaki;
        }

        /*Tao class khi nhan vao o*/
        .tile-active{
            border: 3px solid red;
            background-color: white;
            z-index: 10;
        }

        /*Tao class khi mat o*/
        .tile-empty{
            background-color: transparent;
            border: none;
            cursor: default;
            pointer-events: none;
        }

        .tile-rock{
            background-image: url("./image/rock.jpg");
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            background-color: transparent;
            cursor: not-allowed;
            pointer-events: none;
        }

        .tile-ice{
            background-color: lightblue;
            border: 2px solid darkblue;
            opacity: 0.6;
            cursor: not-allowed;
            pointer-events: none;
        }

        .game-header{
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-bottom: 20px;
            z-index: 100;
            position: relative;
        }

        .time-text{
            color: red;
        }

        .btn-action{
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 20px;
            margin-bottom: 50px;
            z-index: 100;
            position: relative;
        }

        .btn-bottom{
            width: 220px;
            padding: 12px;
            font-size: 18px;
            font-weight: bold;
            background-color: lightgray;
            color: black;
            border: 3px solid #000000;
            border-radius: 10px;
            cursor: pointer;
        }

        .btn-bottom:hover{
            background-color: dimgray;
        }

        #result-popup, #pause-popup{
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }

        .popup-content{
            z-index: 10000;
            text-align: center;
        }

        #result-title, #pause-title{
            color: gold;
            font-size: 40px;
        }

        #result-message{
            color: white;
            font-size: 20px;
            margin-bottom: 20px;
        }

        .btn-next{
            background-color: lawngreen;
            color: white;
            border-color: black;
        }

        .btn-next:hover{
            background-color: darkgreen;
        }

        .btn-replay{
            background-color: orange;
            color: white;
            border-color: black;
        }

        .btn-replay:hover{
            background-color: chocolate;
        }

        .btn-home{
            margin-top: 10px;
        }

        .btn-resume{
            background-color: deepskyblue;
            color: white;
            border-color: black;
        }

        .btn-resume:hover{
            background-color: mediumblue;
        }

        #live-container{
            display: none;
            color: deeppink;
        }

        .fa-heart{
            margin-left: 5px;
        }

        #darkness{
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 99;
            background: radial-gradient(circle at 50% 50%, transparent 60px, rgba(0,0,0,0.98) 150px);
        }
    </style>
</head>
<body>
<div id="main-game">
    <h1 class="game-name">PIKACHU</h1>
    <div class="menu-btn">
        <button class="btn-menu" onclick="openLevelTable()">Chơi game</button>
        <button class="btn-menu" onclick="alert('Nhiệm vụ của bạn là tìm và nối các cặp hình Pokémon giống nhau sao cho đường nối giữa chúng gấp khúc tối đa 3 đoạn thẳng (không quá 2 lần rẽ) và không bị các ô khác cản đường')">Hướng dẫn</button>
    </div>
</div>
<div id="table-level">
    <div class="bg-black" onclick="closeLevelTable()"></div>
    <div class="table-popup">
        <h2>Chọn level</h2>
        <button class="btn-level" onclick="playgame(1)">Level 1</button>
        <button class="btn-level" onclick="playgame(2)">Level 2</button>
        <button class="btn-level" onclick="playgame(3)">Level 3</button>
        <button class="btn-level" onclick="playgame(4)">Level 4</button>
        <button class="btn-level" onclick="playgame(5)">Level 5</button>
        <button class="btn-level" onclick="playgame(6)">Level 6</button>

        <button class="btn-close" onclick="closeLevelTable()">Quay lại menu</button>
    </div>
</div>

<div id="game-screen">
    <div class="game-header">
        <h2 id="level-title">Level: <span id="num-level">1</span></h2>
        <h2 id="live-container">
            Mạng: <span id="num-live">10</span>
            <i class="fa-solid fa-heart"></i>
        </h2>
        <h2 class="time-text">Thời gian: <span id="time-left">0</span> giây</h2>
    </div>
    <div id="board"></div>
    <div class="btn-action">
        <button class="btn-bottom" onclick="pauseGame()">Tạm dừng</button>
        <button class="btn-bottom" onclick="openLevelTable()">Chọn level khác</button>
        <button class="btn-bottom" onclick="backMenu()">Thoát màn chơi</button>
    </div>
</div>

<div id="darkness"></div>

<div id="result-popup">
    <div class="bg-black"></div>
    <div class="table-popup popup-content">
        <h2 id="result-title">Chúc mừng!</h2>
        <p id="result-message">Bạn đã hoàn thành level!</p>
        <button id="btn-next-level" class="btn-level btn-next" onclick="quaMan()">Qua màn</button>
        <button class="btn-level btn-replay" onclick="choiLai()">Chơi lại</button>
        <button class="btn-level btn-home" onclick="backMenu()">Về màn hình chính</button>
    </div>
</div>

<div id="pause-popup">
    <div class="bg-black"></div>
    <div class="table-popup popup-content">
        <h2 id="pause-title">Đã tạm dừng game</h2>
        <button class="btn-level btn-resume" onclick="resumeGame()">Tiếp tục chơi</button>
        <button class="btn-level btn-replay" onclick="choiLai()">Chơi lại</button>
        <button class="btn-level btn-home" onclick="backMenu()">Về màn hình chính</button>
    </div>
</div>
<script src="game.js"></script>
</body>
</html>
